services:
  postgres:
    image: postgres:17
    container_name: kite-postgres
    environment:
      POSTGRES_DB: kite
      POSTGRES_USER: kite
      POSTGRES_PASSWORD: kite
    ports:
      - "5432:5432"
    volumes:
      - kite-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kite-redis
    ports:
      - "6379:6379"
    volumes:
      - kite-redis-data:/data

volumes:
  kite-postgres-data:
  kite-redis-data:
